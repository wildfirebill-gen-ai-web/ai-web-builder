name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "24"

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Type check all packages
        run: pnpm --filter @awb/core exec tsc --noEmit

      - name: Type check web app
        run: pnpm --filter @awb/web exec tsc --noEmit

      - name: Type check desktop
        run: pnpm --filter @awb/desktop exec tsc --noEmit

      - name: Type check UI package
        run: pnpm --filter @awb/ui exec tsc --noEmit

      - name: Type check config package
        run: pnpm --filter @awb/config exec tsc --noEmit

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Next lint
        run: pnpm lint
