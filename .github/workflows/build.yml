name: Build Desktop

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - windows
          - macos
          - linux

env:
  NODE_VERSION: "24"

jobs:
  build-windows:
    name: Windows EXE
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows') || github.event_name == 'release'
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app then desktop (Windows)
        run: pnpm --filter @awb/desktop build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-web-builder-windows
          path: apps/desktop/release/
          compression-level: 0

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/release/*.{exe}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    name: macOS DMG
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'macos') || github.event_name == 'release'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app then desktop (macOS)
        run: pnpm --filter @awb/desktop build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-web-builder-macos
          path: apps/desktop/release/
          compression-level: 0

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/release/*.{dmg,zip}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Linux AppImage
    if: github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'linux') || github.event_name == 'release'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.8.0

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            rpm fakeroot dpkg-dev \
            libx11-xcb1 libxcb-dri3-0 libxcomposite1 \
            libxdamage1 libxfixes3 libxrandr2 \
            libgtk-3-0 libgbm1 libpango-1.0-0 \
            libcairo2 libasound2t64 libatk-bridge2.0-0t64

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build web app then desktop (Linux)
        run: pnpm --filter @awb/desktop build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-web-builder-linux
          path: apps/desktop/release/
          compression-level: 0

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: apps/desktop/release/*.{AppImage,deb,rpm}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
