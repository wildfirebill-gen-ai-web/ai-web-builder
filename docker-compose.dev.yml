version: "3.9"

services:
  web:
    image: node:20-alpine
    container_name: ai-web-builder-dev
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    volumes:
      - .:/app
      - /app/node_modules
      - /app/apps/web/node_modules
      - /app/packages/core/node_modules
      - /app/packages/ui/node_modules
      - /app/packages/config/node_modules
    command: sh -c "npm install -g pnpm && pnpm install && pnpm web"
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
